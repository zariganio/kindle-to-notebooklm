<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kindle to Notebook LM</title>
    <link rel="stylesheet" href="/static/style.css" />
  </head>
  <body>
    <div class="container">
      <h1>Kindle → Notebook LM</h1>
      <p class="subtitle">Upload a Kindle-derived file and prepare a clean text version.</p>

      <form id="uploadForm" enctype="multipart/form-data">
        <label for="fileInput">Choose file</label>
        <input id="fileInput" type="file" name="file" accept=".pdf,.txt,.md,.rtf" />
        <button type="submit">Extract text</button>
      </form>

      <div id="status" class="status hidden"></div>

      <div id="result" class="result hidden">
        <h2>Extracted text preview</h2>
        <pre id="preview"></pre>
        <a id="downloadLink" href="#" download>Download cleaned text</a>
      </div>
    </div>

    <script>
      const form = document.getElementById('uploadForm');
      const statusEl = document.getElementById('status');
      const resultEl = document.getElementById('result');
      const previewEl = document.getElementById('preview');
      const downloadLink = document.getElementById('downloadLink');

      form.addEventListener('submit', async (event) => {
        event.preventDefault();

        const fileInput = document.getElementById('fileInput');
        const file = fileInput.files[0];

        if (!file) {
          statusEl.textContent = 'Please choose a file first.';
          statusEl.classList.remove('hidden');
          return;
        }

        statusEl.textContent = 'Processing...';
        statusEl.classList.remove('hidden');
        resultEl.classList.add('hidden');

        const formData = new FormData();
        formData.append('file', file);

        try {
          const res = await fetch('/api/process', {
            method: 'POST',
            body: formData,
          });

          const data = await res.json();

          if (!res.ok) {
            throw new Error(data.error || 'Processing failed');
          }

          statusEl.textContent = 'Success!';
          previewEl.textContent = data.text_preview || 'No text found.';
          downloadLink.href = `/downloads/${data.output}`;
          downloadLink.setAttribute('download', data.output);
          resultEl.classList.remove('hidden');
        } catch (error) {
          statusEl.textContent = error.message;
          statusEl.classList.remove('hidden');
        }
      });
    </script>
  </body>
</html>
